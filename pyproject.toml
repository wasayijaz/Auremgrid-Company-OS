[project]
name = "auremgrid-company-os"
version = "0.1.0"
description = "Local-first agency operating brain with tenant isolation, temporal evidence, client brains, and work-loop contracts."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.scripts]
auremgrid = "auremgrid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

