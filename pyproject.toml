[project]
name = "auremgrid-company-os"
version = "0.1.0"
description = "Local-first agency operating brain with tenant isolation, temporal evidence, client brains, and work-loop contracts."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.scripts]
auremgrid = "auremgrid.cli:main"

[project.optional-dependencies]
semantic = ["sentence-transformers"]
graphiti = ["graphiti-core>=0.29.3,<0.30"]
postgres = ["psycopg[binary]>=3.2"]
browser = ["playwright>=1.48,<2", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser: deterministic localhost dashboard verification (requires Playwright and Chromium)",
]

